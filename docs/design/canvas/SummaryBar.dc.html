<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game summary bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap&subset=latin-ext,cyrillic">
<style>
body{margin:0}
</style>
</helmet>
<section aria-label="Game summary" style="box-sizing: border-box; background: {{t.barBg}}; color: #F6F1E4; border-bottom: 4px solid #FFD21F; font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.4; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 24px;">

  <sc-for list="{{sides}}" as="s" hint-placeholder-count="2">
    <div style="order: {{s.order}}; flex: 1 1 260px; max-width: 420px; display: flex; align-items: center; gap: 12px; justify-content: {{s.justify}}; flex-direction: {{s.dir}};">
      <svg aria-hidden="true" width="34" height="38" viewBox="0 0 28 32" style="flex: 0 0 auto;"><path d="M14 1l12 4v10c0 8-5 13-12 16C7 28 2 23 2 15V5z" fill="{{s.color}}" stroke="{{s.color}}" stroke-width="2"/></svg>
      <div style="display: flex; flex-direction: column; gap: 4px; align-items: {{s.align}};">
        <div style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.05em;">{{s.name}} <span style="font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12px; color: #B3AA94; letter-spacing: 0;">{{s.draft}}</span></div>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums;">
          <li title="Players" style="display: inline-flex; align-items: center; gap: 5px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B3AA94" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.5 2 4.5 5"/></svg><strong>{{s.players}}</strong><span style="color: #B3AA94;">players</span></li>
          <li title="Goals" style="display: inline-flex; align-items: center; gap: 5px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B3AA94" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l3.8 2.8-1.4 4.4H9.6L8.2 10.3z"/></svg><strong>{{s.goals}}</strong><span style="color: #B3AA94;">goals</span></li>
          <li title="Header goals" style="display: inline-flex; align-items: center; gap: 5px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B3AA94" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="14" r="7"/><path d="M12 10.5l2.7 2-1 3.1h-3.4l-1-3.1z"/><path d="M8 4.5l4-2.5 4 2.5"/></svg><strong>{{s.heads}}</strong><span style="color: #B3AA94;">headers</span></li>
          <li title="Passes" style="display: inline-flex; align-items: center; gap: 5px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B3AA94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h13M12 6l6 6-6 6"/></svg><strong>{{s.passes}}</strong><span style="color: #B3AA94;">passes</span></li>
        </ul>
      </div>
    </div>
  </sc-for>

  <div style="order: 1; flex: 0 1 300px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
    <div style="display: flex; align-items: center; gap: 8px;" title="Final score">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B3AA94" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M12 6v12M7 12h.01M17 12h.01"/></svg>
      <span style="font-family: 'Oswald', sans-serif; font-weight: 700; font-size: {{scoreSize}}px; line-height: 1; color: #FFD21F; font-variant-numeric: tabular-nums; letter-spacing: 0.02em;">{{score}}</span>
    </div>
    <div style="width: 100%;" role="group" aria-label="Win chance estimate: BMW {{chanceA}} percent, HONDA {{chanceB}} percent">
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-variant-numeric: tabular-nums;">
        <span style="display: inline-flex; align-items: center; gap: 4px;"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B3AA94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 8-9"/><path d="M15 5h5v5"/></svg><strong>{{chanceA}}%</strong></span>
        <span style="color: #B3AA94; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;">Win chance · estimate</span>
        <strong>{{chanceB}}%</strong>
      </div>
      <div aria-hidden="true" style="display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: #2E2A20; margin-top: 3px;"><span style="width: {{chanceA}}%; background: #F6F1E4;"></span><span style="width: {{chanceB}}%; background: #FF6A5F;"></span></div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"enum","default":"stats","options":["draft","stats","review"]},"$preview":{"width":1280,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const stage = this.props.stage ?? 'stats';
    // Sample numbers per stage of the new-game flow; the chance is a pre-game estimate, the formula is still open (S10.25)
    const data = {
      draft: { score: '0 : 0', a: { players: 10, goals: 0, heads: 0, passes: 0 }, b: { players: 10, goals: 0, heads: 0, passes: 0 } },
      stats: { score: '4 : 1', a: { players: 10, goals: 3, heads: 1, passes: 4 }, b: { players: 10, goals: 0, heads: 0, passes: 2 } },
      review: { score: '4 : 1', a: { players: 10, goals: 3, heads: 1, passes: 4 }, b: { players: 10, goals: 0, heads: 0, passes: 2 } }
    }[stage];
    const sides = [
      { name: 'BMW', draft: '1st draft', color: '#F6F1E4', order: 0, justify: 'flex-end', dir: 'row', align: 'flex-start', ...data.a },
      { name: 'HONDA', draft: '2nd draft', color: '#FF6A5F', order: 2, justify: 'flex-start', dir: 'row-reverse', align: 'flex-end', ...data.b }
    ];
    return { t: { barBg: '#000000' }, sides, score: data.score, scoreSize: 40, chanceA: 58, chanceB: 42 };
  }
}
</script>
</body>
</html>
