<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SFL sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;700;800&family=Oswald:wght@500;600;700&display=swap&subset=latin-ext,cyrillic">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="min-height: 100%; box-sizing: border-box; background: {{t.bg}}; color: {{t.text}}; font-family: {{t.body}}; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; align-items: center; padding: 32px 16px;">

  <a href="#" aria-label="SFL, home" style="margin-bottom: 24px;">
    <span style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: {{t.markBg}}; color: {{t.markFg}}; border-radius: {{t.radiusSm}}px; font-family: {{t.head}}; font-weight: {{t.headW}}; font-size: 18px; letter-spacing: {{t.headLs}};">SFL</span>
  </a>

  <main style="width: 100%; max-width: 400px; box-sizing: border-box; background: {{t.surface}}; border: 1px solid {{t.border}}; border-top: {{t.cardTop}}px solid {{t.accentLine}}; border-radius: {{t.radius}}px; padding: 24px; display: flex; flex-direction: column; gap: 16px;">
    <h1 style="margin: 0; font-family: {{t.head}}; font-weight: {{t.headW}}; font-size: 31px; line-height: 1.2; letter-spacing: {{t.headLs}}; text-transform: {{t.headCase}};">Sign in</h1>
    <p style="margin: 0; font-size: 14px; color: {{t.muted}};">For league administrators and players with an account.</p>

    <div role="alert" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: {{t.radiusSm}}px; border: 1px solid {{t.errBorder}}; background: {{t.errBg}}; color: {{t.errFg}}; font-size: 14px;">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex: 0 0 auto; margin-top: 2px;"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>
      <span><strong>Wrong email or password.</strong> Check both and try again.</span>
    </div>

    <form style="display: flex; flex-direction: column; gap: 16px;">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600;">Email
        <input type="email" value="player@example.test" autocomplete="username" style="box-sizing: border-box; height: 48px; padding: 0 12px; border: 1px solid {{t.border}}; border-radius: {{t.radiusSm}}px; background: {{t.bg}}; color: {{t.text}}; font: inherit; font-size: 16px; font-weight: 400;">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600;">Password
        <input type="password" value="password" autocomplete="current-password" aria-invalid="true" style="box-sizing: border-box; height: 48px; padding: 0 12px; border: 2px solid {{t.errFg}}; border-radius: {{t.radiusSm}}px; background: {{t.bg}}; color: {{t.text}}; font: inherit; font-size: 16px; font-weight: 400;">
      </label>
      <button type="submit" style="height: 48px; border: 0; border-radius: {{t.radiusSm}}px; background: {{t.btnBg}}; color: {{t.btnFg}}; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;">Sign in</button>
    </form>
  </main>

  <p style="margin: 20px 0 0; font-size: 14px; color: {{t.muted}};">No account? <a href="#" style="color: {{t.text}}; font-weight: 700;">Ask the league administrator</a></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"direction":{"editor":"enum","default":"scoreboard","options":["scoreboard","pitch","clean"]},"mode":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":360,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const dir = this.props.direction ?? 'scoreboard';
    const dark = (this.props.mode ?? 'light') === 'dark';
    const base = {
      scoreboard: {
        body: "'Inter', sans-serif", head: "'Oswald', 'Arial Narrow', sans-serif",
        headW: 600, headLs: '0.03em', headCase: 'uppercase', radius: 4, radiusSm: 4, cardTop: 4,
        light: { bg: '#F2EBDC', surface: '#FBF8F0', border: '#D3C8B0', text: '#15130F', muted: '#5A5246', accentLine: '#FFD21F', btnBg: '#FFD21F', btnFg: '#15130F', markBg: '#FFD21F', markFg: '#15130F' },
        dark: { bg: '#0D0C0A', surface: '#16140F', border: '#2E2A20', text: '#F6F1E4', muted: '#B3AA94', accentLine: '#FFD21F', btnBg: '#FFD21F', btnFg: '#0D0C0A', markBg: '#FFD21F', markFg: '#0D0C0A' }
      },
      pitch: {
        body: "'Manrope', 'Inter', sans-serif", head: "'Manrope', 'Inter', sans-serif",
        headW: 800, headLs: '-0.01em', headCase: 'none', radius: 16, radiusSm: 10, cardTop: 0,
        light: { bg: '#F6F3EA', surface: '#FFFFFF', border: '#E0DACB', text: '#14241B', muted: '#55635A', accentLine: '#0F7B45', btnBg: '#0F7B45', btnFg: '#FFFFFF', markBg: '#0F7B45', markFg: '#FFFFFF' },
        dark: { bg: '#0F1A14', surface: '#17261D', border: '#263A2E', text: '#EAF2EC', muted: '#A3B8AA', accentLine: '#4ADE80', btnBg: '#4ADE80', btnFg: '#0F1A14', markBg: '#4ADE80', markFg: '#0F1A14' }
      },
      clean: {
        body: "'Inter', sans-serif", head: "'Inter', sans-serif",
        headW: 700, headLs: '-0.02em', headCase: 'none', radius: 8, radiusSm: 6, cardTop: 1,
        light: { bg: '#FAFAFA', surface: '#FFFFFF', border: '#E5E7EB', text: '#111827', muted: '#4B5563', accentLine: '#0E7C86', btnBg: '#111827', btnFg: '#FFFFFF', markBg: '#111827', markFg: '#FFFFFF' },
        dark: { bg: '#0B0F14', surface: '#12181F', border: '#212A33', text: '#E6EAF0', muted: '#9AA5B4', accentLine: '#2DD4BF', btnBg: '#E6EAF0', btnFg: '#0B0F14', markBg: '#E6EAF0', markFg: '#0B0F14' }
      }
    }[dir];
    const t = { ...base, ...(dark ? base.dark : base.light) };
    // Error colours: the same meaning in every direction, readable on the surface in both themes
    t.errFg = dark ? '#FF8A80' : '#B3261E';
    t.errBg = dark ? 'rgba(255,138,128,0.10)' : '#FDECEA';
    t.errBorder = dark ? 'rgba(255,138,128,0.45)' : '#F2B8B5';
    return { t };
  }
}
</script>
</body>
</html>
