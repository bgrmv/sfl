<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!--
    Набор значков SFL (S10.26). Один размер 24 × 24, линия 2 px, цвет берётся из currentColor.
    Использование: <svg aria-hidden="true" width="20" height="20"><use href="icons.svg#goal"/></svg>
    Значок не несёт смысла один: рядом всегда текст или aria-label. Список и значения: docs/design/reference-analysis.md.
  -->
  <defs>
    <symbol id="goal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9" /><path d="M12 7.5l3.8 2.8-1.4 4.4H9.6L8.2 10.3z" />
    </symbol>
    <symbol id="goal-head" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <circle cx="12" cy="14" r="7" /><path d="M12 10.5l2.7 2-1 3.1h-3.4l-1-3.1z" /><path d="M8 4.5l4-2.5 4 2.5" stroke-linecap="round" />
    </symbol>
    <symbol id="penalty" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="9" /><circle cx="12" cy="12" r="2.5" fill="currentColor" />
    </symbol>
    <symbol id="own-goal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="9" /><path d="M8 12h8" />
    </symbol>
    <symbol id="pass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12h13M12 6l6 6-6 6" />
    </symbol>
    <symbol id="mvp" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z" />
    </symbol>
    <symbol id="captain" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="currentColor" /><path d="M14.8 9.2a3.8 3.8 0 1 0 0 5.6" fill="none" stroke="var(--icon-on, #0D0C0A)" stroke-width="2" stroke-linecap="round" />
    </symbol>
    <symbol id="transfer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4" />
    </symbol>
    <symbol id="players" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="9" cy="8" r="3" /><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" /><circle cx="17" cy="9" r="2.5" /><path d="M17 14c2.5 0 4.5 2 4.5 5" />
    </symbol>
    <symbol id="chance" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 17l5-6 4 3 8-9" /><path d="M15 5h5v5" />
    </symbol>
    <symbol id="score" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <rect x="3" y="6" width="18" height="12" rx="2" /><path d="M12 6v12M7 12h.01M17 12h.01" />
    </symbol>
    <symbol id="position" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="5" width="18" height="14" rx="1" /><path d="M12 5v14" /><circle cx="12" cy="12" r="2.5" />
    </symbol>

    <!-- Позиции игрока (S10.28): значок + код + название; цвет не несёт смысла -->
    <symbol id="pos-gk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 11V6.5M11 11V4.5M14 11V5.5M17 11V8M6 11h11.5v5a5 5 0 0 1-5 5h-1.5a5 5 0 0 1-5-5zM6 13l-2.5-2.5" />
    </symbol>
    <symbol id="pos-def" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z" />
    </symbol>
    <symbol id="pos-mid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v18M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" />
    </symbol>
    <symbol id="pos-wing" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19c6 0 11-3 14-11M8 19c5 0 9-2 12-6M12 19c3.5 0 6-1 8-3" />
    </symbol>
    <symbol id="pos-fwd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 17V9h4l1.5 3 5 1.5c1.7.5 2.5 1.5 2.5 3V17zM6 19.5h12M6 11.5L2.5 10M6 14L2 14.5" />
    </symbol>
  </defs>
</svg>
