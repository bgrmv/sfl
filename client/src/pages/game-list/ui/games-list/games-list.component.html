<section>
  @for (game of games(); track game.id) {
    @defer {
      <sfl-game-card [gameCard]="game" />
    } @placeholder {
      <mat-progress-bar
        mode="indeterminate"
        style="height: 200px"
      />
    }
  } @empty {
    @if (!loading()) {
      <p class="empty">No games in this season yet.</p>
    }
  }
</section>
