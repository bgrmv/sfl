<h2 mat-dialog-title>
  Edit player
  <sup [style.color]="'#ccc'">{{ data.id }}</sup>
</h2>

<mat-dialog-content>
  <form
    novalidate
    (submit)="$event.preventDefault(); onSubmit()"
  >
    <mat-form-field>
      <mat-label>Nickname</mat-label>
      <input
        matInput
        type="text"
        [formField]="f.nickname"
      />
      @for (e of f.nickname().errors(); track e) {
        <mat-error>{{ e.message }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>Number</mat-label>
      <input
        matInput
        type="number"
        [formField]="f.number"
      />
      @for (e of f.number().errors(); track e) {
        <mat-error>{{ e.message }}</mat-error>
      }
    </mat-form-field>

    <fieldset class="user-fieldset">
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input
          matInput
          type="text"
          [formField]="f.user.email"
        />
        @for (e of f.user.email().errors(); track e) {
          <mat-error>{{ e.message }}</mat-error>
        }
      </mat-form-field>

      <mat-form-field>
        <mat-label>Name</mat-label>
        <input
          matInput
          type="text"
          [formField]="f.user.name"
        />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Surname</mat-label>
        <input
          matInput
          [formField]="f.user.surname"
        />
      </mat-form-field>
    </fieldset>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-button
    type="button"
    (click)="onNoClick()"
  >
    Close
  </button>

  <button
    color="primary"
    type="button"
    mat-raised-button
    cdkFocusInitial
    (click)="onSubmit()"
  >
    Ok
  </button>
</mat-dialog-actions>
