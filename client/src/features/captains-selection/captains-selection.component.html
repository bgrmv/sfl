<h1>Select Captain (Team: {{ team }})</h1>

<p>{{ captains$ | async | json }}</p>
<p>{{ captainsWithoutTeam$ | async | json }}</p>
<p>{{ selectedCaptain$ | async | json }}</p>

@if ((selectedCaptain$ | async)!; as captain) {
  <sfl-captain-stats-card
    [captain]="captain"
    [class.active]="true"
  ></sfl-captain-stats-card>
  <button
    mat-flat-button
    color="warn"
    (click)="deleteSelected(captain.id)"
  >
    Reset
  </button>
} @else {
  <div class="captains-corousel">
    @for (
      captain of captainsWithoutTeam$ | async;
      track captain;
      let odd = $odd
    ) {
      <sfl-captain-stats-card
        [captain]="captain"
        [attr.data-captain-id]="captain.id"
        [class.odd]="odd"
      ></sfl-captain-stats-card>
    }
  </div>
}
