<h1>Select Captain (Team: {{ team() }})</h1>

<p>{{ captains() | json }}</p>
<p>{{ captainsWithoutTeam() | json }}</p>
<p>{{ selectedCaptain() | json }}</p>

@if (selectedCaptain()!; as captain) {
  <sfl-captain-stats-card
    [captain]="captain"
    [class.active]="true"
  />
  <button
    mat-flat-button
    color="warn"
    (click)="deleteSelected(captain.id)"
  >
    Reset
  </button>
} @else {
  <div class="captains-corousel">
    @for (captain of captainsWithoutTeam(); track captain; let odd = $odd) {
      <sfl-captain-stats-card
        [captain]="captain"
        [attr.data-captain-id]="captain.id"
        [class.odd]="odd"
      />
    }
  </div>
}
