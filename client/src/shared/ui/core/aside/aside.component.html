<aside>
  <nav class="navigation">
    @for (link of links; track link) {
      <a
        [routerLink]="link.href"
        routerLinkActive="active"
      >
        @if (link.icon) {
          <mat-icon [fontIcon]="link.icon"></mat-icon>
        }
        {{ link.name | uppercase }}
      </a>
    }
  </nav>
</aside>
