name: sfl-dev

services:
  workspace:
    # Own image: the Microsoft one ships an old Node 22, see Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    # Published by Docker, not forwarded by VS Code: they work even when
    # no VS Code window is attached to the container
    ports:
      - 127.0.0.1:4200:4200
      - 127.0.0.1:3001:3001
    volumes:
      - ..:/workspaces/sfl:cached
      # node_modules live in volumes: native binaries are built for Linux
      # and do not clash with node_modules on the Windows host
      - client-node-modules:/workspaces/sfl/client/node_modules
      - server-nest-node-modules:/workspaces/sfl/server-nest/node_modules
      - schemas-node-modules:/workspaces/sfl/packages/schemas/node_modules
      # Otherwise pnpm puts its store into the repository root
      - pnpm-store:/home/node/.pnpm-store
      # Claude Code login and settings survive container rebuilds
      - claude-config:/home/node/.claude
    environment:
      npm_config_store_dir: /home/node/.pnpm-store
      # Keeps .claude.json inside the volume too, not in /home/node
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # corepack must not write packageManager into package.json (that is S1.2)
      COREPACK_ENABLE_AUTO_PIN: '0'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # The repository is a bind mount from Windows: file events do not reach
      # the container, so 'nest start --watch' never restarts. Poll instead.
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  client-node-modules:
  server-nest-node-modules:
  schemas-node-modules:
  pnpm-store:
  claude-config:
  mongodb-data:
